        function updateStudentMeta(resId, field, value) {
            const res = AppState.results.find(r => r.id === resId);
            if (!res) return;
            res[field] = value.trim();
            saveState();
            renderCurrentRoute();
        }

        function manualOverrideAnswer(resId, qIdx, newOpt) {
            const res = AppState.results.find(r => r.id === resId);
            const exam = AppState.exams.find(e => e.id === res?.examId);
            if (!res || !exam) return;

            res.answers[qIdx] = newOpt;
            res.statuses[qIdx] = newOpt === '' ? 'EMPTY' : 'OK';
            const updated = gradeStudentAnswers(exam, res.answers, res.statuses);
            Object.assign(res, updated);
            saveState();
            openStudentDetailModal(resId);
            renderCurrentRoute();
        }

        function markResultVerified(resId) {
            const res = AppState.results.find(r => r.id === resId);
            if (res) {
                res.statuses = res.statuses.map(s => s === 'VERIFY' ? 'OK' : s);
                res.needsVerification = false;
                saveState();
                renderCurrentRoute();
            }
            closeModal();
        }

        // ============================================================================
        // 12. VIEW 6: REKAP NILAI, ANALISIS BUTIR SOAL & EKSPOR EXCEL / PDF
        // ============================================================================
        let analyticsItemChart = null;

        function renderAnalytics(container) {
            const exam = getActiveExam();
            if (!exam) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center">Silakan buat ujian terlebih dahulu.</div>`;
                return;
            }

            const results = AppState.results.filter(r => r.examId === exam.id);
            const kkm = AppState.settings.kkm;
            const passedCount = results.filter(r => r.score >= kkm).length;
            const failedCount = results.length - passedCount;
            const passRate = results.length ? ((passedCount / results.length) * 100).toFixed(1) : '0.0';
            const avgScore = results.length ? (results.reduce((s, r) => s + r.score, 0) / results.length).toFixed(1) : '0.0';

            // Analisis Butir Soal
            const itemAnalysis = exam.answerKey.map((k, idx) => {
                let correct = 0;
                let wrong = 0;
                let empty = 0;
                results.forEach(r => {
                    const ans = r.answers[idx];
                    if (!ans || ans === 'EMPTY') empty++;
                    else if (ans === k.answer) correct++;
                    else wrong++;
                });
                const pctCorrect = results.length ? Math.round((correct / results.length) * 100) : 0;
                let category = 'Sedang';
                if (pctCorrect >= 75) category = 'Mudah';
                else if (pctCorrect < 40) category = 'Sukar';

                return { no: k.no, key: k.answer, points: k.points, correct, wrong, empty, pctCorrect, category };
            });

            container.innerHTML = `
                <div class="space-y-6">
                    <!-- Tombol Ekspor -->
                    <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-4">
                        <div>
                            <h3 class="font-bold text-slate-800">Rekapitulasi Nilai & Analisis Butir Soal</h3>
                            <p class="text-xs text-slate-500">${exam.examName} • ${exam.subject} • KKM: <strong>${kkm}</strong></p>
                        </div>
                        <div class="flex flex-wrap items-center gap-2">
                            <button onclick="exportResultsToExcel()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-3.5 py-2.5 rounded-xl transition flex items-center gap-1.5">
                                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                                <span>Download Excel (.xlsx)</span>
                            </button>
                            <button onclick="exportRecapToPdf()" class="text-xs bg-rose-600 hover:bg-rose-700 text-white font-semibold px-3.5 py-2.5 rounded-xl transition flex items-center gap-1.5">
                                <i data-lucide="file-text" class="w-4 h-4"></i>
                                <span>Download Rekap PDF</span>
                            </button>
                            <button onclick="window.print()" class="text-xs bg-slate-800 hover:bg-slate-900 text-white font-semibold px-3.5 py-2.5 rounded-xl transition flex items-center gap-1.5">
                                <i data-lucide="printer" class="w-4 h-4"></i>
                                <span>Cetak Laporan</span>
                            </button>
                        </div>
                    </div>

                    <!-- Ringkasan Ketuntasan -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                            <p class="text-xs font-semibold text-slate-500">Rata-Rata Kelas</p>
                            <p class="text-2xl font-extrabold text-blue-600 mt-2">${avgScore}</p>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                            <p class="text-xs font-semibold text-slate-500">Siswa Tuntas (&ge; ${kkm})</p>
                            <p class="text-2xl font-extrabold text-emerald-600 mt-2">${passedCount} <span class="text-xs font-normal text-slate-400">siswa</span></p>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                            <p class="text-xs font-semibold text-slate-500">Belum Tuntas (&lt; ${kkm})</p>
                            <p class="text-2xl font-extrabold text-rose-600 mt-2">${failedCount} <span class="text-xs font-normal text-slate-400">siswa</span></p>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm">
                            <p class="text-xs font-semibold text-slate-500">Persentase Ketuntasan</p>
                            <p class="text-2xl font-extrabold text-indigo-600 mt-2">${passRate}%</p>
                        </div>
                    </div>

                    <!-- Grafik Analisis Butir Soal -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
                        <h4 class="font-bold text-slate-800 text-sm mb-1">Grafik Persentase Jawaban Benar per Nomor Soal</h4>
                        <p class="text-xs text-slate-500 mb-4">Membantu guru mengidentifikasi soal yang terlalu sulit atau materi yang perlu diulang</p>
                        <div class="h-64 w-full">
                            <canvas id="itemAnalysisChart"></canvas>
                        </div>
                    </div>

                    <!-- Tabel Analisis Soal -->
                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="p-4 border-b border-slate-200">
                            <h4 class="font-bold text-slate-800 text-sm">Rincian Analisis Butir Soal</h4>
                        </div>
                        <div class="overflow-x-auto max-h-96">
                            <table class="w-full text-left border-collapse text-xs">
                                <thead class="bg-slate-50 border-b border-slate-200 text-[11px] font-bold text-slate-500 uppercase sticky top-0">
                                    <tr>
                                        <th class="py-2.5 px-4">No. Soal</th>
                                        <th class="py-2.5 px-3 text-center">Kunci</th>
                                        <th class="py-2.5 px-3 text-center">Bobot Point</th>
                                        <th class="py-2.5 px-3 text-center">Menjawab Benar</th>
                                        <th class="py-2.5 px-3 text-center">Menjawab Salah</th>
                                        <th class="py-2.5 px-3 text-center">Kosong</th>
                                        <th class="py-2.5 px-3 text-center">Persentase Benar</th>
                                        <th class="py-2.5 px-4 text-right">Kategori Soal</th>

                                <tbody class="divide-y divide-slate-100">

                                        <tr class="hover:bg-slate-50">
                                            <td class="py-2.5 px-4 font-bold">Soal #${it.no}</td>
                                            <td class="py-2.5 px-3 text-center font-bold text-blue-600">${it.key}</td>
                                            <td class="py-2.5 px-3 text-center">${it.points}</td>
                                            <td class="py-2.5 px-3 text-center font-bold text-emerald-600">${it.correct}</td>
                                            <td class="py-2.5 px-3 text-center font-bold text-rose-600">${it.wrong}</td>
                                            <td class="py-2.5 px-3 text-center text-slate-500">${it.empty}</td>
                                            <td class="py-2.5 px-3 text-center font-bold">${it.pctCorrect}%</td>
                                            <td class="py-2.5 px-4 text-right">
                                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                                    it.category === 'Mudah' ? 'bg-emerald-100 text-emerald-700' :
                                                    it.category === 'Sedang' ? 'bg-blue-100 text-blue-700' : 'bg-rose-100 text-rose-700'
                                                }">${it.category}</span>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            const ctx = document.getElementById('itemAnalysisChart').getContext('2d');
            if (analyticsItemChart) analyticsItemChart.destroy();
            analyticsItemChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: itemAnalysis.map(i => `No.${i.no}`),
                    datasets: [{
                        label: '% Siswa Menjawab Benar',
                        data: itemAnalysis.map(i => i.pctCorrect),
                        backgroundColor: itemAnalysis.map(i => i.pctCorrect >= 75 ? '#10b981' : (i.pctCorrect >= 40 ? '#3b82f6' : '#f43f5e')),
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true, max: 100 } }
                }
            });
        }

        function exportResultsToExcel() {
            const exam = getActiveExam();
            const results = AppState.results.filter(r => r.examId === exam.id);
            if (!results.length) {
                showToast('Belum Ada Data', 'Belum ada hasil koreksi siswa untuk diekspor.', 'warning');
                return;
            }

            const rows = results.map((r, i) => ({
                No: i + 1,
                'Nomor Peserta': r.studentNumber,
                'Nama Siswa': r.studentName,
                Kelas: r.studentClass,
                Benar: r.correctCount,
                Salah: r.wrongCount,
                Kosong: r.emptyCount,
                Ganda: r.doubleCount,
                'Point Diperoleh': r.pointsEarned,
                'Point Maksimal': r.maxPoints,
                'Nilai Akhir': r.score,
                Keterangan: r.score >= AppState.settings.kkm ? 'TUNTAS' : 'REMEDIAL'
            }));

            const ws = XLSX.utils.json_to_sheet(rows);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'RekapNilai');
            XLSX.writeFile(wb, `Rekap_Nilai_${exam.subject}_${exam.className}.xlsx`);
            showToast('Excel Berhasil Diunduh', 'File rekap nilai siap dibuka di Microsoft Excel.', 'success');
        }

        function exportRecapToPdf() {
            const exam = getActiveExam();
            const results = AppState.results.filter(r => r.examId === exam.id);
            if (!results.length) {
                showToast('Belum Ada Data', 'Belum ada hasil koreksi siswa untuk diekspor.', 'warning');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');

            doc.setFontSize(14);
            doc.setFont(undefined, 'bold');
            doc.text(exam.schoolName.toUpperCase(), 14, 16);
            doc.setFontSize(11);
            doc.text(`REKAPITULASI HASIL UJIAN: ${exam.examName}`, 14, 23);
            doc.setFontSize(9);
            doc.setFont(undefined, 'normal');
            doc.text(`Mata Pelajaran: ${exam.subject} | Kelas: ${exam.className} | Guru: ${exam.teacherName} | Tanggal: ${exam.examDate}`, 14, 29);

            // Table Header
            let y = 38;
            doc.setFillColor(241, 245, 249);
            doc.rect(14, y - 5, 182, 8, 'F');
            doc.setFont(undefined, 'bold');
            doc.text('No', 16, y);
            doc.text('No. Peserta', 26, y);
            doc.text('Nama Siswa', 55, y);
            doc.text('B / S / K', 125, y);
            doc.text('Point', 150, y);
            doc.text('Nilai', 175, y);

            doc.setFont(undefined, 'normal');
            y += 7;

            results.forEach((r, idx) => {
                if (y > 280) {
                    doc.addPage();
                    y = 20;
                }
                doc.text(String(idx + 1), 16, y);
                doc.text(String(r.studentNumber), 26, y);
                doc.text(String(r.studentName).slice(0, 32), 55, y);
                doc.text(`${r.correctCount} / ${r.wrongCount} / ${r.emptyCount + r.doubleCount}`, 125, y);
                doc.text(`${r.pointsEarned}/${r.maxPoints}`, 150, y);
                doc.setFont(undefined, 'bold');
                doc.text(String(r.score), 175, y);
                doc.setFont(undefined, 'normal');
                y += 6.5;
            });

            doc.save(`Rekap_Nilai_${exam.subject}_${exam.className}.pdf`);
            showToast('PDF Rekap Diunduh', 'Dokumen PDF rekap nilai berhasil dibuat.', 'success');
        }

        // ============================================================================
        // 13. VIEW 7: PENGATURAN OMR, AI VISION & BACKUP DATA
        // ============================================================================
        function renderSettings(container) {
            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Kalibrasi OMR & KKM -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                        <h3 class="font-bold text-slate-800 text-base">Kalibrasi Sensor OMR & Kriteria Ketuntasan</h3>
                        <p class="text-xs text-slate-500">Sesuaikan sensitivitas pembacaan bulatan jawaban dan standar KKM sekolah.</p>

                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">Kriteria Ketuntasan Minimal (KKM)</label>
                            <input type="number" min="0" max="100" value="${AppState.settings.kkm}"
                                onchange="AppState.settings.kkm = Number(this.value); saveState(); showToast('Pengaturan Disimpan', 'KKM diperbarui.', 'success');"
                                class="w-full px-3.5 py-2 text-sm border border-slate-300 rounded-xl">
                        </div>

                        <div>
                            <div class="flex justify-between text-xs font-semibold text-slate-700 mb-1">
                                <span>Sensitivitas Kehitaman Bulatan OMR</span>
                                <span id="lbl-thresh">${Math.round(AppState.settings.omrThreshold * 100)}%</span>
                            </div>
                            <input type="range" min="0.20" max="0.65" step="0.02" value="${AppState.settings.omrThreshold}"
                                oninput="document.getElementById('lbl-thresh').textContent = Math.round(this.value*100)+'%'"
                                onchange="AppState.settings.omrThreshold = Number(this.value); saveState(); showToast('Kalibrasi Disimpan', 'Sensitivitas OMR diperbarui.', 'success');"
                                class="w-full accent-blue-600">
                            <p class="text-[11px] text-slate-400 mt-1">Turunkan jika siswa menggunakan pensil yang tipis; naikkan jika kertas LJK agak kotor.</p>
                        </div>

                        <div class="pt-3 border-t border-slate-200">
                            <h4 class="font-bold text-slate-800 text-sm mb-1">Integrasi AI Vision (Opsional untuk Tulisan Tangan)</h4>
                            <p class="text-xs text-slate-500 mb-3">Digunakan untuk membaca tulisan tangan Nama & Nomor Peserta pada LJK yang tidak memakai QR Code.</p>
                            <label class="flex items-center gap-2 text-xs font-semibold text-slate-700 mb-2 cursor-pointer">
                                <input type="checkbox" ${AppState.settings.useAiVisionForIdentity ? 'checked' : ''}
                                    onchange="AppState.settings.useAiVisionForIdentity = this.checked; saveState();">
                                <span>Aktifkan Pembacaan Identitas Tulisan Tangan dengan AI Vision</span>
                            </label>
                            <input type="password" placeholder="Masukkan Gemini API Key (Opsional)..." value="${AppState.settings.geminiApiKey}"
                                onchange="AppState.settings.geminiApiKey = this.value.trim(); saveState(); showToast('API Key Disimpan', 'Konfigurasi AI Vision diperbarui.', 'info');"
                                class="w-full px-3.5 py-2 text-xs border border-slate-300 rounded-xl">
                        </div>
                    </div>

                    <!-- Backup & Pemulihan Database -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                        <h3 class="font-bold text-slate-800 text-base">Cadangkan & Pulihkan Data Permanen</h3>
                        <p class="text-xs text-slate-500">Semua ujian, kunci jawaban, dan hasil koreksi tersimpan otomatis di browser Anda. Unduh berkas cadangan secara berkala untuk keamanan maksimal.</p>

                        <div class="p-4 rounded-xl bg-blue-50 border border-blue-200 flex items-center justify-between gap-3">
                            <div>
                                <p class="text-xs font-bold text-blue-900">Unduh Backup Database (.JSON)</p>
                                <p class="text-[11px] text-blue-700">Simpan salinan seluruh ujian & nilai siswa ke komputer Anda.</p>
                            </div>
                            <button onclick="downloadBackupJson()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2 rounded-xl shrink-0">
                                Backup Sekarang
                            </button>
                        </div>

                        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between gap-3">
                            <div>
                                <p class="text-xs font-bold text-slate-800">Pulihkan Data dari File Backup</p>
                                <p class="text-[11px] text-slate-500">Unggah file .JSON cadangan sebelumnya.</p>
                            </div>
                            <label class="cursor-pointer bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold px-4 py-2 rounded-xl shrink-0">
                                Pilih File JSON
                                <input type="file" accept=".json" onchange="restoreBackupJson(event)" class="hidden">
                            </label>
                        </div>

                        <div class="pt-4 border-t border-slate-200">
                            <button onclick="confirmResetAllData()" class="text-xs text-rose-600 hover:bg-rose-50 font-semibold px-3.5 py-2 rounded-xl border border-rose-200 transition">
                                Reset & Hapus Semua Data Aplikasi
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function downloadBackupJson() {
            const payload = JSON.stringify({
                exportedAt: new Date().toISOString(),
                exams: AppState.exams,
                results: AppState.results,
                settings: AppState.settings
            }, null, 2);

            const blob = new Blob([payload], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Backup_SmartExamScanner_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Backup Berhasil', 'File cadangan JSON berhasil diunduh.', 'success');
        }

        function restoreBackupJson(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (Array.isArray(data.exams) && Array.isArray(data.results)) {
                        AppState.exams = data.exams;
                        AppState.results = data.results;
                        if (data.settings) AppState.settings = { ...AppState.settings, ...data.settings };
                        AppState.activeExamId = AppState.exams[0]?.id || null;
                        await saveState();
                        renderCurrentRoute();
                        showToast('Pemulihan Berhasil', `${AppState.exams.length} ujian dan ${AppState.results.length} hasil siswa dipulihkan.`, 'success');
                    } else {
                        throw new Error('Format tidak valid');
                    }
                } catch (err) {
                    showToast('Gagal Memulihkan', 'File backup tidak valid atau rusak.', 'error');
                }
            };
            reader.readAsText(file);
        }

        function confirmResetAllData() {
            openModal(`
                <div class="space-y-4">
                    <h3 class="font-bold text-rose-600 text-base">Konfirmasi Hapus Semua Data</h3>
                    <p class="text-xs text-slate-600">Tindakan ini akan menghapus seluruh paket ujian dan hasil koreksi siswa secara permanen dari perangkat ini. Pastikan Anda sudah melakukan backup terlebih dahulu.</p>
                    <div class="flex justify-end gap-2">
                        <button onclick="closeModal()" class="px-4 py-2 text-xs font-semibold bg-slate-100 rounded-xl">Batal</button>
                        <button onclick="executeResetAllData()" class="px-4 py-2 text-xs font-semibold bg-rose-600 text-white rounded-xl">Ya, Hapus Semua</button>
                    </div>
                </div>
            `);
        }

        async function executeResetAllData() {
            AppState.exams = [];
            AppState.results = [];
            createDefaultExamIfEmpty();
            await saveState();
            closeModal();
            navigate('dashboard');
            showToast('Database Direset', 'Aplikasi kembali ke pengaturan awal.', 'warning');
        }

        // ============================================================================
        // 14. BOOTSTRAP APLIKASI
        // ============================================================================
        window.addEventListener('DOMContentLoaded', async () => {
            await loadState();
            createDefaultExamIfEmpty();
            updateHeaderAndBadges();
            navigate('dashboard');
        });
    </script>
</body>
</html>
