    <meta charset="UTF-8">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* A4 Print & LJK Styling */
        .ljk-sheet {
            width: 210mm;
            min-height: 297mm;
            background: #ffffff;
            color: #000000;
            position: relative;
            box-sizing: border-box;
            padding: 12mm;
            margin: 0 auto;
            border: 1px solid #e2e8f0;
        }
        .marker {
            width: 8mm;
            height: 8mm;
            background: #000000;
            position: absolute;
        }
        .marker-tl { top: 8mm; left: 8mm; }
        .marker-tr { top: 8mm; right: 8mm; }
        .marker-bl { bottom: 8mm; left: 8mm; }
        .marker-br { bottom: 8mm; right: 8mm; }

        .omr-bubble {
            width: 18px;
            height: 18px;
            border: 1.5px solid #000;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            color: #000;
            user-select: none;
        }
        .omr-bubble.filled {
            background-color: #000000;
            color: #000000;
        }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="antialiased selection:bg-blue-600 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

    <!-- Custom Modal Container -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-40 hidden items-center justify-center p-4">
        <div id="modal-content" class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 border border-slate-200">
            <!-- Dynamic modal content -->
        </div>
    </div>

    <div class="flex h-screen overflow-hidden">
        <!-- Mobile Sidebar Backdrop -->
        <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 z-20 hidden lg:hidden"></div>

        <!-- Sidebar Navigation -->

            <!-- Brand -->
            <div class="p-5 flex items-center gap-3 border-b border-slate-800">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-600/30 shrink-0">
                    <i data-lucide="scan-line" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-white font-bold text-base tracking-tight leading-tight">SMART EXAM</h1>
                    <p class="text-[11px] text-blue-400 font-semibold tracking-wider">AI & OMR SCANNER</p>
                </div>
            </div>

            <!-- Menu Links -->
            <nav class="flex-1 overflow-y-auto p-3 space-y-1">
                <button onclick="navigate('dashboard')" data-nav="dashboard" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>1. Dashboard</span>

                <button onclick="navigate('create-exam')" data-nav="create-exam" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all">
                    <i data-lucide="file-plus-2" class="w-4 h-4"></i>
                    <span>2. Buat Ujian & LJK</span>
                </button>
                <button onclick="navigate('answer-key')" data-nav="answer-key" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all">
                    <i data-lucide="key-round" class="w-4 h-4"></i>
                    <span>3. Kunci Jawaban</span>

                    <i data-lucide="settings" class="w-4 h-4"></i>

            <!-- Storage Indicator -->
            <div class="p-4 border-t border-slate-800 text-xs text-slate-400">
                <div class="flex items-center justify-between mb-1">
                    <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Database Lokal Aktif</span>
                    <span id="db-count" class="font-mono text-slate-300">0 LJK</span>
                </div>
                <p class="text-[11px] text-slate-500">Data tersimpan permanen di perangkat.</p>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
            <!-- Top Header -->
            <header class="bg-white border-b border-slate-200 px-4 lg:px-8 py-3.5 flex items-center justify-between gap-4 shrink-0">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    <div>
                        <h2 id="page-title" class="text-lg font-bold text-slate-800">Dashboard Utama</h2>
                        <p id="page-subtitle" class="text-xs text-slate-500 hidden sm:block">Ringkasan statistik penilaian dan pemindaian lembar jawaban otomatis</p>
                    </div>
                </div>
                <div class="flex items-center gap-2 sm:gap-3">
                    <button onclick="generateSampleDemoData()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-2 rounded-xl transition flex items-center gap-1.5" title="Muat contoh ujian & hasil siswa untuk uji coba">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-blue-600"></i>
                        <span class="hidden sm:inline">Muat Data Demo</span>
                    </button>
                    <button onclick="navigate('scanner')" class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-semibold px-3.5 py-2 rounded-xl shadow-sm shadow-blue-600/20 transition flex items-center gap-1.5">
                        <i data-lucide="scan" class="w-3.5 h-3.5"></i>

                    </button>
                </div>

            <!-- Scrollable Page Content -->
            <main id="main-content" class="flex-1 overflow-y-auto p-4 lg:p-8">
                <!-- Views injected here -->
            </main>

    <!-- Hidden Print Container -->
    <div id="print-area" class="hidden"></div>

    <script>
        // ============================================================================
        // 1. STATE & INDEXEDDB PERSISTENT STORAGE ENGINE
        // ============================================================================
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const DB_NAME = 'SmartExamScannerDB';
        const DB_VERSION = 1;
        let dbInstance = null;

        let AppState = {
            currentRoute: 'dashboard',
            activeExamId: null,
            exams: [],
            results: [], // { id, examId, sheetUid, studentName, studentClass, studentNumber, answers: [], statuses: [], score, pointsEarned, maxPoints, correctCount, wrongCount, emptyCount, doubleCount, needsVerification, scannedAt, imageDataUrl }
            settings: {
                kkm: 75,
                omrThreshold: 0.38, // Ambang kehitaman bulatan (0.1 - 0.8)
                omrAmbiguityMargin: 0.12, // Selisih minimum untuk membedakan jawaban yakin vs ragu
                geminiApiKey: '',
                useAiVisionForIdentity: false
            }
        };

        // Inisialisasi IndexedDB agar penyimpanan permanen & tahan kapasitas gambar besar
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('state')) {
                        db.createObjectStore('state');
                    }
                };
                request.onsuccess = (e) => {
                    dbInstance = e.target.result;
                    resolve(dbInstance);
                };
                request.onerror = (e) => reject(e);
            });
        }

        async function saveState() {
            try {
                if (!dbInstance) await initDB();
                const tx = dbInstance.transaction('state', 'readwrite');
                const store = tx.objectStore('state');
                store.put({
                    activeExamId: AppState.activeExamId,
                    exams: AppState.exams,
                    results: AppState.results,
                    settings: AppState.settings
                }, 'appData');
                updateHeaderAndBadges();
            } catch (err) {
                console.error('Gagal menyimpan database:', err);
            }
        }

        async function loadState() {
            try {
                if (!dbInstance) await initDB();
                return new Promise((resolve) => {
                    const tx = dbInstance.transaction('state', 'readonly');
                    const store = tx.objectStore('state');
                    const req = store.get('appData');
                    req.onsuccess = () => {
                        if (req.result) {
                            AppState.activeExamId = req.result.activeExamId;
                            AppState.exams = req.result.exams || [];
                            AppState.results = req.result.results || [];
                            AppState.settings = { ...AppState.settings, ...(req.result.settings || {}) };
                        }
                        resolve();
                    };
                    req.onerror = () => resolve();
                });
            } catch (err) {
                console.error('Gagal memuat database:', err);
            }
        }

        // ============================================================================
        // 2. UTILITY & NOTIFICATION HELPERS
        // ============================================================================
        function showToast(title, message, type = 'success') {
            const container = document.getElementById('toast-container');
            const colors = {
                success: 'bg-emerald-600 text-white border-emerald-700',
                error: 'bg-rose-600 text-white border-rose-700',
                warning: 'bg-amber-500 text-slate-950 border-amber-600',
                info: 'bg-blue-600 text-white border-blue-700'
            };
            const icons = {
                success: 'check-circle',
                error: 'alert-circle',
                warning: 'alert-triangle',
                info: 'info'
            };
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-start gap-3 p-3.5 rounded-xl shadow-lg border ${colors[type]} transition-all duration-300 transform translate-y-0 opacity-100`;
            toast.innerHTML = `
                <i data-lucide="${icons[type]}" class="w-5 h-5 shrink-0 mt-0.5"></i>
                <div class="flex-1 text-xs">
                    <p class="font-bold text-sm">${title}</p>
                    <p class="opacity-90 mt-0.5">${message}</p>
                </div>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-4');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function openModal(htmlContent) {
            const backdrop = document.getElementById('modal-backdrop');
            const content = document.getElementById('modal-content');
            content.innerHTML = htmlContent;
            backdrop.classList.remove('hidden');
            backdrop.classList.add('flex');
            lucide.createIcons();
        }

        function closeModal() {
            const backdrop = document.getElementById('modal-backdrop');
            backdrop.classList.add('hidden');
            backdrop.classList.remove('flex');
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function getActiveExam() {
            if (!AppState.exams.length) return null;
            let exam = AppState.exams.find(e => e.id === AppState.activeExamId);
            if (!exam) {
                exam = AppState.exams[0];
                AppState.activeExamId = exam.id;
            }
            return exam;
        }

        function switchActiveExam(examId) {
            AppState.activeExamId = examId;
            saveState();
            renderCurrentRoute();
            showToast('Ujian Aktif Diganti', 'Menampilkan data untuk ujian yang dipilih.', 'info');
        }

        function updateHeaderAndBadges() {
            const select = document.getElementById('global-exam-select');
            if (select) {
                if (AppState.exams.length === 0) {
                    select.innerHTML = `<option value="">-- Belum Ada Ujian --</option>`;
                } else {
                    select.innerHTML = AppState.exams.map(e =>
                        `<option value="${e.id}" ${e.id === AppState.activeExamId ? 'selected' : ''}>${e.examName} (${e.subject} - ${e.className})</option>`
                    ).join('');
                }
            }

            document.getElementById('db-count').textContent = `${AppState.results.length} LJK`;

            const activeExam = getActiveExam();
            const unverifiedCount = activeExam
                ? AppState.results.filter(r => r.examId === activeExam.id && r.needsVerification).length
                : 0;
            const badge = document.getElementById('badge-verify');
            if (unverifiedCount > 0) {
                badge.textContent = unverifiedCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // ============================================================================
        // 3. DATA DEMO & INISIALISASI AWAL
        // ============================================================================
        function createDefaultExamIfEmpty() {
            if (AppState.exams.length > 0) return;
            const defaultExam = {
                id: 'EXAM-' + Date.now(),
                schoolName: 'SMP NEGERI 1 NUSANTARA',
                subject: 'Ilmu Pengetahuan Alam (IPA)',
                className: 'VIII-A',
                teacherName: 'Budi Santoso, S.Pd.',
                examName: 'Penilaian Tengah Semester (PTS) Ganjil',
                examDate: new Date().toISOString().split('T')[0],
                questionCount: 20,
                answerKey: Array.from({ length: 20 }, (_, i) => ({
                    no: i + 1,
                    answer: ['A', 'B', 'C', 'D'][i % 4],
                    points: i < 10 ? 4 : 6 // Total 100 point (10x4 + 10x6)
                }))
            };
            AppState.exams.push(defaultExam);
            AppState.activeExamId = defaultExam.id;
            saveState();
        }

        function generateSampleDemoData() {
            const exam = getActiveExam();
            if (!exam) return;

            const sampleStudents = [
                { name: 'Ahmad Fauzi', cls: exam.className, num: '08-001', acc: 0.90 },
                { name: 'Siti Nurhaliza', cls: exam.className, num: '08-002', acc: 0.85 },
                { name: 'Dimas Pratama', cls: exam.className, num: '08-003', acc: 0.65 },
                { name: 'Putri Ayu Lestari', cls: exam.className, num: '08-004', acc: 0.95 },
                { name: 'Rizky Ramadhan', cls: exam.className, num: '08-005', acc: 0.55 },
                { name: 'Nabila Zahra', cls: exam.className, num: '08-006', acc: 0.80 }
            ];

            let added = 0;
            sampleStudents.forEach((st, idx) => {
                const uid = `${exam.id}-DEMO-${st.num}`;
                if (AppState.results.some(r => r.sheetUid === uid)) return;

                const answers = [];
                const statuses = [];
                exam.answerKey.forEach((k, qIdx) => {
                    if (idx === 2 && qIdx === 4) {
                        answers.push('DOUBLE');
                        statuses.push('DOUBLE');
                    } else if (idx === 4 && qIdx === 7) {
                        answers.push('');
                        statuses.push('EMPTY');
                    } else if (Math.random() < st.acc) {
                        answers.push(k.answer);
                        statuses.push('OK');
                    } else {
                        const wrongOpts = ['A', 'B', 'C', 'D'].filter(o => o !== k.answer);
                        answers.push(wrongOpts[Math.floor(Math.random() * 3)]);
                        statuses.push('OK');
                    }
                });

                const graded = gradeStudentAnswers(exam, answers, statuses);
                AppState.results.push({
                    id: 'RES-' + Date.now() + '-' + idx,
                    examId: exam.id,
                    sheetUid: uid,
                    studentName: st.name,
                    studentClass: st.cls,
                    studentNumber: st.num,
                    ...graded,
                    scannedAt: new Date().toLocaleString('id-ID'),
                    imageDataUrl: null
                });
                added++;
            });

            saveState();
            renderCurrentRoute();
            if (added > 0) {
                showToast('Data Demo Dimuat', `${added} hasil koreksi siswa berhasil ditambahkan untuk simulasi.`, 'success');
            } else {
                showToast('Data Demo Sudah Ada', 'Data simulasi untuk ujian ini sudah dimuat sebelumnya.', 'info');
            }
        }

        // ============================================================================
        // 4. LOGIKA PENILAIAN (GRADING ENGINE)
        // ============================================================================
        function gradeStudentAnswers(exam, studentAnswers, statuses) {
            let correctCount = 0;
            let wrongCount = 0;
            let emptyCount = 0;
            let doubleCount = 0;
            let pointsEarned = 0;
            let maxPoints = 0;
            let needsVerification = false;

            exam.answerKey.forEach((keyItem, index) => {
                const pt = Number(keyItem.points) || 0;
                maxPoints += pt;
                const ans = studentAnswers[index] || '';
                const st = statuses[index] || 'OK';

                if (st === 'VERIFY' || st === 'DOUBLE') {
                    needsVerification = true;
                }

                if (st === 'DOUBLE' || ans === 'DOUBLE') {
                    doubleCount++;
                } else if (!ans || ans === 'EMPTY') {
                    emptyCount++;
                } else if (ans === keyItem.answer) {
                    correctCount++;
                    pointsEarned += pt;
                } else {
                    wrongCount++;
                }
            });

            const score = maxPoints > 0 ? Number(((pointsEarned / maxPoints) * 100).toFixed(2)) : 0;

            return {
                answers: studentAnswers,
                statuses,
                correctCount,
                wrongCount,
                emptyCount,
                doubleCount,
                pointsEarned,
                maxPoints,
                score,
                needsVerification
            };
        }

        // ============================================================================
        // 5. ROUTING & NAVIGATION
        // ============================================================================
        const routeMeta = {
            'dashboard': { title: 'Dashboard Utama', subtitle: 'Ringkasan statistik penilaian dan pemindaian lembar jawaban otomatis' },
            'create-exam': { title: 'Buat Ujian & Cetak LJK', subtitle: 'Konfigurasi identitas ujian dan cetak Lembar Jawaban Komputer (LJK) format A4' },
            'answer-key': { title: 'Kunci Jawaban & Bobot Point', subtitle: 'Atur kunci jawaban A, B, C, D dan bobot nilai per nomor soal' },
            'scanner': { title: 'Scanner LJK Otomatis (OMR & AI)', subtitle: 'Pindai melalui kamera langsung, unggah foto, atau pemindaian massal (Batch)' },
            'results': { title: 'Hasil Koreksi & Verifikasi', subtitle: 'Daftar nilai siswa, koreksi manual jika ragu, dan perbandingan jawaban' },
            'analytics': { title: 'Rekap Nilai & Analisis Butir Soal', subtitle: 'Statistik ketuntasan belajar, analisis tingkat kesukaran soal, dan ekspor Excel/PDF' },
            'settings': { title: 'Pengaturan Sistem & Backup Data', subtitle: 'Kalibrasi sensor OMR, integrasi AI Vision, dan cadangkan database' }
        };

        function navigate(route) {
            AppState.currentRoute = route;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.dataset.nav === route) {
                    btn.classList.add('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-600/20');
                    btn.classList.remove('text-slate-300', 'hover:bg-slate-800', 'hover:text-white');
                } else {
                    btn.classList.remove('bg-blue-600', 'text-white', 'shadow-md', 'shadow-blue-600/20');
                    btn.classList.add('text-slate-300', 'hover:bg-slate-800', 'hover:text-white');
                }
            });

            document.getElementById('page-title').textContent = routeMeta[route].title;
            document.getElementById('page-subtitle').textContent = routeMeta[route].subtitle;

            // Close mobile sidebar if open
            const sidebar = document.getElementById('sidebar');
            if (!sidebar.classList.contains('-translate-x-full') && window.innerWidth < 1024) {
                toggleSidebar();
            }

            renderCurrentRoute();
        }

        function renderCurrentRoute() {
            const container = document.getElementById('main-content');
            switch (AppState.currentRoute) {
                case 'dashboard': renderDashboard(container); break;
                case 'create-exam': renderCreateExam(container); break;
                case 'answer-key': renderAnswerKey(container); break;
                case 'scanner': renderScanner(container); break;
                case 'results': renderResults(container); break;
                case 'analytics': renderAnalytics(container); break;
                case 'settings': renderSettings(container); break;
            }
            lucide.createIcons();
        }

        // ============================================================================
        // 6. VIEW 1: DASHBOARD UTAMA
        // ============================================================================
        let dashboardChartInstance = null;

        function renderDashboard(container) {
            const totalExams = AppState.exams.length;
            const totalScanned = AppState.results.length;

        function handleCreateExam(e) {
            e.preventDefault();
            const qCount = Math.min(100, Math.max(5, parseInt(document.getElementById('ex-qcount').value) || 20));
            const defaultPt = Number((100 / qCount).toFixed(2));
            const subject = document.getElementById('ex-subject').value.trim();
            const className = document.getElementById('ex-class').value.trim();

            const newExam = {
                id: 'EXAM-' + Date.now(),
                schoolName: 'SMP NEGERI 1 NUSANTARA',
                subject: subject,
                className: className,
                teacherName: '-',
                examName: `Ujian ${subject} (${className})`,
                examDate: new Date().toISOString().split('T')[0],
                questionCount: qCount,
                answerKey: Array.from({ length: qCount }, (_, i) => ({
                    no: i + 1,
                    answer: 'A',
                    points: defaultPt
                }))
            };

            AppState.exams.unshift(newExam);
            AppState.activeExamId = newExam.id;
            saveState();
            renderCurrentRoute();
            showToast('Ujian Berhasil Dibuat', `LJK ${qCount} soal siap dicetak. Silakan atur kunci jawaban.`, 'success');
        }

        function deleteExam(examId) {
            AppState.exams = AppState.exams.filter(e => e.id !== examId);
            AppState.results = AppState.results.filter(r => r.examId !== examId);
            if (AppState.activeExamId === examId) {
                AppState.activeExamId = AppState.exams[0]?.id || null;
            }
            saveState();
            renderCurrentRoute();
            showToast('Ujian Dihapus', 'Paket ujian dan hasil terkait telah dihapus.', 'warning');
        }

        // Membangun struktur HTML LJK A4 dengan koordinat deterministik agar 100% terbaca oleh OMR Scanner
        function buildLjkHtml(exam, studentPreset = null) {
            const cols = exam.questionCount <= 25 ? 1 : (exam.questionCount <= 50 ? 2 : (exam.questionCount <= 75 ? 3 : 4));
            const rowsPerCol = Math.ceil(exam.questionCount / cols);

            let columnsHtml = '';
            for (let c = 0; c < cols; c++) {
                let rowsHtml = '';
                for (let r = 0; r < rowsPerCol; r++) {
                    const qNum = c * rowsPerCol + r + 1;
                    if (qNum <= exam.questionCount) {
                        const presetAns = studentPreset?.answers?.[qNum - 1] || '';
                        rowsHtml += `
                            <div class="flex items-center justify-between py-1 px-1.5 border-b border-slate-200 text-xs">
                                <span class="font-bold w-6 text-right pr-1.5">${qNum}.</span>
                                <div class="flex items-center gap-2.5">
                                    ${['A', 'B', 'C', 'D'].map(opt => `
                                        <span class="omr-bubble ${presetAns === opt ? 'filled' : ''}">${opt}</span>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }
                }
                columnsHtml += `<div class="border border-black rounded p-1.5 bg-white">${rowsHtml}</div>`;
            }

            const sheetCode = `${exam.id}|${studentPreset ? studentPreset.num : 'TEMPLATE'}`;

            return `
                <div id="ljk-a4-canvas" class="ljk-sheet shadow-md">
                    <!-- 4 Corner Alignment Markers (Wajib untuk Deteksi OMR) -->
                    <div class="marker marker-tl"></div>

                                <p><strong>Mata Pelajaran:</strong> ${exam.subject}</p>
                                <p><strong>Kelas:</strong> ${exam.className}</p>
                                <p><strong>Jumlah Soal:</strong> ${exam.questionCount} Butir</p>
                                <p><strong>Kode Paket:</strong> ${exam.id}</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-center shrink-0">
                            <div id="ljk-qrcode" class="p-1 border border-black bg-white"></div>
                            <span class="text-[8px] font-mono mt-1">${exam.id}</span>
                        </div>
                    </div>

                    <!-- Identitas Siswa -->
                    <div class="mx-8 border border-black p-3 mb-4 grid grid-cols-12 gap-3 text-xs">
                        <div class="col-span-6">
                            <label class="font-bold block mb-1">NAMA LENGKAP SISWA:</label>
                            <div class="border-b border-dotted border-black h-6 flex items-center font-mono font-bold text-sm">
                                ${studentPreset ? studentPreset.name : ''}
                            </div>
                        </div>
                        <div class="col-span-3">
                            <label class="font-bold block mb-1">NOMOR PESERTA:</label>
                            <div class="border border-black h-6 px-2 flex items-center font-mono font-bold text-sm">
                                ${studentPreset ? studentPreset.num : ''}
                            </div>
                        </div>
                        <div class="col-span-3">
                            <label class="font-bold block mb-1">KELAS:</label>
                            <div class="border border-black h-6 px-2 flex items-center font-mono font-bold text-sm">
                                ${studentPreset ? studentPreset.cls : exam.className}
                            </div>
                        </div>
                        <div class="col-span-12 text-[10px] bg-slate-100 p-1.5 border border-slate-400">
                            <strong>PETUNJUK PENGISIAN:</strong> Hitamkan penuh satu bulatan pilihan jawaban (A, B, C, atau D) menggunakan pensil 2B atau pulpen hitam. Jangan melipat atau mengotori tanda kotak hitam di keempat sudut kertas.
                        </div>
                    </div>

                    <!-- Grid Jawaban OMR -->
                    <div class="mx-8">
                        <div class="grid grid-cols-${cols} gap-3">
                            ${columnsHtml}
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="mx-8 mt-4 pt-2 border-t border-black flex justify-between text-[10px] font-mono">
                        <span>SMART EXAM SCANNER SYSTEM • KODE: ${sheetCode}</span>

            `;

        function renderLjkQrCode(exam, preset = null) {
            const qrEl = document.getElementById('ljk-qrcode');
            if (!qrEl) return;
            qrEl.innerHTML = '';
            const payload = JSON.stringify({
                e: exam.id,
                q: exam.questionCount,
                s: preset ? preset.num : ''
            });
            new QRCode(qrEl, {
                text: payload,
                width: 64,
                height: 64,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
        }

        function printLjkSheet() {
            const ljkEl = document.getElementById('ljk-a4-canvas');
            if (!ljkEl) return;
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = ljkEl.outerHTML;
            printArea.classList.remove('hidden');
            window.print();
            printArea.classList.add('hidden');
        }

        async function downloadLjkPdf() {
            const ljkEl = document.getElementById('ljk-a4-canvas');
            const exam = getActiveExam();
            if (!ljkEl || !exam) return;

            showToast('Membuat PDF LJK...', 'Sedang merender lembar jawaban resolusi tinggi.', 'info');
            const canvas = await html2canvas(ljkEl, { scale: 2, backgroundColor: '#ffffff' });
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            pdf.addImage(imgData, 'PNG', 0, 0, 210, 297);
            pdf.save(`LJK_${exam.subject}_${exam.className}.pdf`);
            showToast('PDF Berhasil Diunduh', 'File LJK A4 siap dicetak untuk siswa.', 'success');
        }

        // Generator Gambar LJK Terisi Sintetis yang PRESISI untuk pengujian langsung di fitur Scanner
        function downloadFilledSampleLjkImage() {
            const exam = getActiveExam();
            if (!exam) return;

            const studentName = 'ANDI WIJAYA';
            const studentNum = 'SMP-099';
            // Buat jawaban acak dengan 1 jawaban ganda & 1 kosong agar guru bisa melihat semua fitur OMR bekerja
            const answers = exam.answerKey.map((k, i) => {
                if (i === 1) return 'DOUBLE'; // Nomor 2 sengaja ganda
                if (i === 3) return '';       // Nomor 4 sengaja kosong
                return Math.random() > 0.2 ? k.answer : ['A', 'B', 'C', 'D'][(i + 1) % 4];
            });

            const canvas = renderSyntheticOmrCanvas(exam, {
                name: studentName,
                num: studentNum,
                cls: exam.className,
                answers
            });

            const link = document.createElement('a');
            link.download = `SAMPEL_LJK_TERISI_${exam.questionCount}SOAL_${studentNum}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            showToast('Sampel LJK Terisi Diunduh', 'Unggah gambar ini di menu "4. Scanner LJK" untuk menguji pembacaan OMR!', 'success');
        }

            }

            const totalPoints = exam.answerKey.reduce((sum, item) => sum + (Number(item.points) || 0), 0);

            container.innerHTML = `
                <div class="space-y-6">
                    <!-- Toolbar Pengaturan Point & Impor Excel -->

                        <div>
                            <h3 class="font-bold text-slate-800">${exam.examName} (${exam.subject})</h3>
                            <p class="text-xs text-slate-500">Total Soal: <strong>${exam.questionCount}</strong> • Total Bobot Point: <strong class="text-blue-600 text-sm" id="total-points-display">${totalPoints}</strong></p>
                        </div>

                        <div class="flex flex-wrap items-center gap-2">
                            <!-- Set Semua Point Sama -->
                            <div class="flex items-center bg-slate-100 rounded-xl p-1 border border-slate-200">
                                <input type="number" id="bulk-point-val" step="0.5" value="5" class="w-16 bg-white text-xs font-bold text-center py-1.5 rounded-lg border border-slate-200 focus:outline-none">
                                <button onclick="applyUniformPoints()" class="text-xs font-semibold text-slate-700 hover:text-blue-600 px-2.5 py-1.5">
                                    Samakan Semua Point

                            <!-- Bagi Rata Total 100 -->
                            <button onclick="distribute100Points()" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold px-3 py-2 rounded-xl border border-indigo-200 transition">
                                Bagi Rata Total = 100
                            </button>

                            <!-- Impor dari Excel -->
                            <label class="cursor-pointer text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-3.5 py-2 rounded-xl transition flex items-center gap-1.5">
                                <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i>
                                <span>Impor Excel</span>
                                <input type="file" accept=".xlsx,.xls,.csv" onchange="importAnswerKeyExcel(event)" class="hidden">

                            <button onclick="downloadKeyTemplateExcel()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium px-3 py-2 rounded-xl transition" title="Unduh format Excel kunci jawaban">
                                Template Excel
                            </button>
                        </div>
                    </div>

                    <!-- Tabel Kunci Jawaban -->
                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 divide-y md:divide-y-0 md:divide-x divide-slate-200">

        }

        function renderAnswerKeyColumns(exam) {
            const perCol = Math.ceil(exam.questionCount / 4);
            let html = '';

            for (let c = 0; c < 4; c++) {
                const start = c * perCol;
                const end = Math.min(start + perCol, exam.questionCount);
                if (start >= exam.questionCount) {
                    html += `<div class="p-4 bg-slate-50/50"></div>`;
                    continue;
                }

                let rows = '';
                for (let i = start; i < end; i++) {
                    const item = exam.answerKey[i];
                    rows += `
                        <tr class="border-b border-slate-100 hover:bg-blue-50/30">
                            <td class="py-2 px-3 text-xs font-bold text-slate-700 w-10">${item.no}</td>
                            <td class="py-2 px-2">
                                <div class="flex items-center gap-1">
                                    ${['A', 'B', 'C', 'D'].map(opt => `
                                        <button type="button" onclick="updateKeyAnswer(${i}, '${opt}')"
                                            class="w-7 h-7 rounded-full text-xs font-bold transition ${item.answer === opt ? 'bg-blue-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                            ${opt}
                                        </button>
                                    `).join('')}
                                </div>
                            </td>
                            <td class="py-2 px-3 text-right">
                                <input type="number" step="0.5" min="0" value="${item.points}" onchange="updateKeyPoint(${i}, this.value)"
                                    class="w-16 text-xs font-semibold text-center py-1 px-1.5 border border-slate-200 rounded-lg focus:border-blue-500 focus:outline-none">
                            </td>
                        </tr>
                    `;
                }

                html += `
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-bold text-slate-500 uppercase">
                                    <th class="py-2.5 px-3">No</th>
                                    <th class="py-2.5 px-2">Kunci</th>
                                    <th class="py-2.5 px-3 text-right">Point</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `;
            }
            return html;
        }

        function updateKeyAnswer(index, opt) {
            const exam = getActiveExam();
            if (!exam) return;
            exam.answerKey[index].answer = opt;
            regradeAllResultsForExam(exam);
            saveState();
            renderCurrentRoute();
        }

        function updateKeyPoint(index, val) {
            const exam = getActiveExam();
            if (!exam) return;
            exam.answerKey[index].points = Math.max(0, parseFloat(val) || 0);
            regradeAllResultsForExam(exam);
            saveState();
            const total = exam.answerKey.reduce((s, x) => s + x.points, 0);
            const disp = document.getElementById('total-points-display');
            if (disp) disp.textContent = total;
            showToast('Point Diperbarui', 'Nilai seluruh siswa otomatis dihitung ulang.', 'info');
        }

        function applyUniformPoints() {
            const exam = getActiveExam();
            const val = parseFloat(document.getElementById('bulk-point-val').value) || 0;
            exam.answerKey.forEach(k => k.points = val);
            regradeAllResultsForExam(exam);
            saveState();
            renderCurrentRoute();
            showToast('Point Massal Diterapkan', `Semua soal diatur menjadi ${val} point.`, 'success');
        }

        function distribute100Points() {
            const exam = getActiveExam();
            const pt = Number((100 / exam.questionCount).toFixed(2));
            exam.answerKey.forEach(k => k.points = pt);
            regradeAllResultsForExam(exam);
            saveState();
            renderCurrentRoute();
            showToast('Point Dibagi Rata', `Setiap soal bernilai ${pt} point (Total 100).`, 'success');
        }

        function regradeAllResultsForExam(exam) {
            AppState.results.forEach(res => {
                if (res.examId === exam.id) {
                    const updated = gradeStudentAnswers(exam, res.answers, res.statuses);
                    Object.assign(res, updated);
                }
            });
        }

        function downloadKeyTemplateExcel() {
            const exam = getActiveExam();
            const data = exam.answerKey.map(k => ({
                No: k.no,
                Kunci: k.answer,
                Point: k.points
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'KunciJawaban');
            XLSX.writeFile(wb, `Template_Kunci_${exam.subject}.xlsx`);
        }

        function importAnswerKeyExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            const exam = getActiveExam();
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const wb = XLSX.read(e.target.result, { type: 'array' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(ws);
                    let updated = 0;
                    rows.forEach(r => {
                        const no = parseInt(r.No || r.no || r.NO);
                        const ans = String(r.Kunci || r.kunci || r.Jawaban || '').trim().toUpperCase();
                        const pt = parseFloat(r.Point || r.point || r.Bobot);
                        if (no >= 1 && no <= exam.questionCount && ['A', 'B', 'C', 'D'].includes(ans)) {
                            exam.answerKey[no - 1].answer = ans;
                            if (!isNaN(pt)) exam.answerKey[no - 1].points = pt;
                            updated++;
                        }
                    });
                    regradeAllResultsForExam(exam);
                    saveState();
                    renderCurrentRoute();
                    showToast('Impor Excel Berhasil', `${updated} kunci jawaban berhasil diperbarui.`, 'success');
                } catch (err) {
                    showToast('Gagal Impor Excel', 'Pastikan kolom Excel bernama: No, Kunci, Point.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // ============================================================================
        // 9. MESIN OMR (OPTICAL MARK RECOGNITION) & AI VISION ENGINE
        // ============================================================================

        // Render LJK Sintetis ke Canvas beresolusi tetap (1000 x 1414 px - Rasio A4)
        // Digunakan untuk membuat sampel LJK siap scan & simulasi batch multi-lembar
        function renderSyntheticOmrCanvas(exam, student) {
            const W = 1000;
            const H = 1414;
            const canvas = document.createElement('canvas');
            canvas.width = W;
            canvas.height = H;
            const ctx = canvas.getContext('2d');

            // Latar putih bersih
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, W, H);

            // 4 Penanda Sudut Hitam (Alignment Markers) di koordinat tetap
            const mSize = 36;
            const mPad = 38;
            ctx.fillStyle = '#000000';
            ctx.fillRect(mPad, mPad, mSize, mSize); // Top-Left
            ctx.fillRect(W - mPad - mSize, mPad, mSize, mSize); // Top-Right
            ctx.fillRect(mPad, H - mPad - mSize, mSize, mSize); // Bottom-Left
            ctx.fillRect(W - mPad - mSize, H - mPad - mSize, mSize, mSize); // Bottom-Right

            // Header Box
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.strokeRect(85, 50, W - 170, 120);

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 20px Inter, sans-serif';
            ctx.fillText(exam.schoolName.toUpperCase(), 105, 82);
            ctx.font = 'bold 15px Inter, sans-serif';
            ctx.fillText(`LJK OMR – ${exam.examName} (${exam.subject})`, 105, 108);
            ctx.font = '13px Inter, sans-serif';
            ctx.fillText(`Nama: ${student.name}   |   No. Peserta: ${student.num}   |   Kelas: ${student.cls}`, 105, 138);

            // Gambar QR Code di pojok kanan header (menggunakan QRCode.js offscreen)
            const qrDiv = document.createElement('div');
            const qrPayload = JSON.stringify({ e: exam.id, q: exam.questionCount, s: student.num, n: student.name, c: student.cls });
            new QRCode(qrDiv, { text: qrPayload, width: 96, height: 96, correctLevel: QRCode.CorrectLevel.M });
            const qrCanvas = qrDiv.querySelector('canvas');
            if (qrCanvas) {
                ctx.drawImage(qrCanvas, W - 195, 62, 96, 96);
            }

            // Grid Bulatan Jawaban (Koordinat terkalibrasi dengan scanner OMR)
            const cols = exam.questionCount <= 25 ? 1 : (exam.questionCount <= 50 ? 2 : (exam.questionCount <= 75 ? 3 : 4));
            const rowsPerCol = Math.ceil(exam.questionCount / cols);
            const gridStartX = 95;
            const gridStartY = 210;
            const gridW = W - 190;
            const gridH = H - 290;
            const colW = gridW / cols;
            const rowH = Math.min(42, gridH / rowsPerCol);

            for (let c = 0; c < cols; c++) {
                const colX = gridStartX + c * colW;
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 1;
                ctx.strokeRect(colX + 4, gridStartY - 15, colW - 8, rowsPerCol * rowH + 20);

                for (let r = 0; r < rowsPerCol; r++) {
                    const qIdx = c * rowsPerCol + r;
                    if (qIdx >= exam.questionCount) break;

                    const cy = gridStartY + r * rowH + rowH * 0.5;
                    ctx.fillStyle = '#000000';
                    ctx.font = 'bold 13px Inter, sans-serif';
                    ctx.fillText(`${qIdx + 1}.`, colX + 12, cy + 5);

                    const ans = student.answers[qIdx] || '';
                    ['A', 'B', 'C', 'D'].forEach((opt, optIdx) => {
                        const cx = colX + 55 + optIdx * 36;
                        const radius = 11;

                        ctx.beginPath();
                        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 1.8;
                        ctx.stroke();

                        // Hitamkan jika dipilih (atau ganda)
                        const shouldFill = (ans === opt) || (ans === 'DOUBLE' && (opt === 'A' || opt === 'C'));
                        if (shouldFill) {
                            ctx.fillStyle = '#000000';
                            ctx.fill();
                        } else {
                            ctx.fillStyle = '#475569';
                            ctx.font = 'bold 10px Inter, sans-serif';
                            ctx.fillText(opt, cx - 3.5, cy + 3.5);
                        }
                    });
                }
            }

            return canvas;
        }

        // Pemrosesan Citra Nyata OMR:
        // 1. Auto-crop & koreksi perspektif/rotasi berbasis 4 penanda sudut gelap
        // 2. Pembacaan QR Code menggunakan jsQR untuk identifikasi otomatis
        // 3. Analisis intensitas piksel (grayscale luminance) pada setiap ROI bulatan A, B, C, D
        // 4. Visualisasi overlay hijau/merah/kuning pada hasil scan
        async function processImageWithOMR(imageSourceCanvas, exam, fallbackMeta = {}) {
            const W = 1000;
            const H = 1414;

            // Normalisasi ukuran & koreksi perspektif sudut
            const alignedCanvas = alignAndNormalizeSheet(imageSourceCanvas, W, H);
            const ctx = alignedCanvas.getContext('2d');
            const imgData = ctx.getImageData(0, 0, W, H);

            // 1. Deteksi QR Code di area header untuk identitas siswa & validasi lembar
            let qrInfo = null;
            try {
                const headerData = ctx.getImageData(0, 0, W, 240);
                const code = jsQR(headerData.data, W, 240);
                if (code && code.data) {
                    qrInfo = JSON.parse(code.data);
                }
            } catch (e) { /* QR tidak terbaca atau format bebas */ }

            // 2. Jika ada AI Vision API Key & gambar adalah foto nyata, baca tulisan tangan nama/nomor siswa
            let aiIdentity = null;
            if (AppState.settings.useAiVisionForIdentity && AppState.settings.geminiApiKey) {
                aiIdentity = await extractStudentIdentityWithGemini(alignedCanvas);
            }

            // 3. Pemindaian Bulatan OMR (Optical Mark Recognition)
            const cols = exam.questionCount <= 25 ? 1 : (exam.questionCount <= 50 ? 2 : (exam.questionCount <= 75 ? 3 : 4));
            const rowsPerCol = Math.ceil(exam.questionCount / cols);
            const gridStartX = 95;
            const gridStartY = 210;
            const gridW = W - 190;
            const gridH = H - 290;
            const colW = gridW / cols;
            const rowH = Math.min(42, gridH / rowsPerCol);

            const detectedAnswers = [];
            const detectedStatuses = [];

            // Buat canvas overlay untuk menunjukkan hasil pembacaan scanner kepada guru
            const overlayCanvas = document.createElement('canvas');
            overlayCanvas.width = W;
            overlayCanvas.height = H;
            const oCtx = overlayCanvas.getContext('2d');
            oCtx.drawImage(alignedCanvas, 0, 0);

            const threshold = AppState.settings.omrThreshold; // default 0.38
            const ambiguityMargin = AppState.settings.omrAmbiguityMargin; // default 0.12

            for (let qIdx = 0; qIdx < exam.questionCount; qIdx++) {
                const c = Math.floor(qIdx / rowsPerCol);
                const r = qIdx % rowsPerCol;
                const colX = gridStartX + c * colW;
                const cy = gridStartY + r * rowH + rowH * 0.5;

                const scores = ['A', 'B', 'C', 'D'].map((opt, optIdx) => {
                    const cx = colX + 55 + optIdx * 36;
                    const darkness = measureBubbleDarkness(imgData, W, H, cx, cy, 9);
                    return { opt, cx, cy, darkness };
                });

                // Urutkan dari yang paling gelap
                const sorted = [...scores].sort((a, b) => b.darkness - a.darkness);
                const top1 = sorted[0];
                const top2 = sorted[1];

                let finalAns = '';
                let status = 'OK';

                if (top1.darkness < threshold) {
                    // Tidak ada bulatan yang cukup hitam -> Kosong
                    // Cek apakah ada arsir samar mendekati ambang batas
                    if (top1.darkness > threshold - 0.08) {
                        status = 'VERIFY';
                        finalAns = top1.opt;
                    } else {
                        status = 'EMPTY';
                        finalAns = '';
                    }
                } else if (top2.darkness >= threshold) {
                    // Lebih dari 1 bulatan melewati ambang batas -> Jawaban Ganda
                    status = 'DOUBLE';
                    finalAns = 'DOUBLE';
                } else if ((top1.darkness - top2.darkness) < ambiguityMargin) {
                    // Selisih terlalu tipis -> Kurang jelas / Perlu Verifikasi
                    status = 'VERIFY';
                    finalAns = top1.opt;
                } else {
                    // Terbaca jelas
                    status = 'OK';
                    finalAns = top1.opt;
                }

                detectedAnswers.push(finalAns);
                detectedStatuses.push(status);

                // Gambar kotak/lingkaran penanda hasil deteksi di overlayCanvas
                const keyAns = exam.answerKey[qIdx]?.answer;
                scores.forEach(s => {
                    if (status === 'DOUBLE' && s.darkness >= threshold) {
                        oCtx.strokeStyle = '#ef4444';
                        oCtx.lineWidth = 3;
                        oCtx.strokeRect(s.cx - 14, s.cy - 14, 28, 28);
                    } else if (s.opt === finalAns && status === 'VERIFY') {
                        oCtx.strokeStyle = '#f59e0b';
                        oCtx.lineWidth = 3;
                        oCtx.strokeRect(s.cx - 14, s.cy - 14, 28, 28);
                    } else if (s.opt === finalAns && status === 'OK') {
                        oCtx.strokeStyle = (finalAns === keyAns) ? '#10b981' : '#ef4444';
                        oCtx.lineWidth = 3;
                        oCtx.beginPath();
                        oCtx.arc(s.cx, s.cy, 14, 0, Math.PI * 2);
                        oCtx.stroke();
                    }
                });
            }

            const studentNum = qrInfo?.s || aiIdentity?.studentNumber || fallbackMeta.studentNumber || `SISWA-${Math.floor(100 + Math.random() * 900)}`;
            const studentName = qrInfo?.n || aiIdentity?.studentName || fallbackMeta.studentName || `Peserta ${studentNum}`;
            const studentClass = qrInfo?.c || aiIdentity?.studentClass || fallbackMeta.studentClass || exam.className;
            const sheetUid = `${exam.id}-${studentNum}`;

            return {
                sheetUid,
                studentName,
                studentClass,
                studentNumber: studentNum,
                answers: detectedAnswers,
                statuses: detectedStatuses,
                overlayDataUrl: overlayCanvas.toDataURL('image/jpeg', 0.78),
                qrDetected: !!qrInfo
            };
        }

        // Mengukur rasio piksel gelap (luminance < 135) di dalam radius bulatan
        function measureBubbleDarkness(imgData, width, height, cx, cy, radius) {
            const data = imgData.data;
            let darkPixels = 0;
            let totalPixels = 0;

            const x0 = Math.max(0, Math.floor(cx - radius));
            const x1 = Math.min(width - 1, Math.ceil(cx + radius));
            const y0 = Math.max(0, Math.floor(cy - radius));
            const y1 = Math.min(height - 1, Math.ceil(cy + radius));

            for (let y = y0; y <= y1; y++) {
                for (let x = x0; x <= x1; x++) {
                    const dx = x - cx;
                    const dy = y - cy;
                    if (dx * dx + dy * dy <= radius * radius) {
                        const idx = (y * width + x) * 4;
                        const lum = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
                        if (lum < 140) darkPixels++;
                        totalPixels++;
                    }
                }
            }
            return totalPixels > 0 ? darkPixels / totalPixels : 0;
        }

        // Auto-crop & koreksi pencahayaan (adaptive contrast stretch) berdasarkan bounding box marker sudut
        function alignAndNormalizeSheet(srcCanvas, targetW, targetH) {
            const out = document.createElement('canvas');
            out.width = targetW;
            out.height = targetH;
            const ctx = out.getContext('2d');

            // Cari area gelap (alignment markers) di 4 kuadran untuk auto-crop margin luar kertas
            const sW = srcCanvas.width;
            const sH = srcCanvas.height;
            const sCtx = srcCanvas.getContext('2d');
            const sData = sCtx.getImageData(0, 0, sW, sH).data;

            let minX = sW, minY = sH, maxX = 0, maxY = 0;
            let foundMarkers = 0;

            // Sampling cepat setiap 4 piksel untuk menemukan kotak marker sudut
            for (let y = 10; y < sH - 10; y += 4) {
                for (let x = 10; x < sW - 10; x += 4) {
                    const i = (y * sW + x) * 4;
                    const lum = (sData[i] + sData[i + 1] + sData[i + 2]) / 3;
                    if (lum < 70) {
                        if (x < minX) minX = x;
                        if (x > maxX) maxX = x;
                        if (y < minY) minY = y;
                        if (y > maxY) maxY = y;
                        foundMarkers++;
                    }
                }
            }

            // Jika ditemukan area konten yang valid, crop dengan margin proporsional ke target A4
            if (foundMarkers > 50 && (maxX - minX) > sW * 0.4 && (maxY - minY) > sH * 0.4) {
                const padX = (maxX - minX) * 0.042;
                const padY = (maxY - minY) * 0.03;
                const sx = Math.max(0, minX - padX);
                const sy = Math.max(0, minY - padY);
                const sw = Math.min(sW - sx, (maxX - minX) + padX * 2);
                const sh = Math.min(sH - sy, (maxY - minY) + padY * 2);
                ctx.drawImage(srcCanvas, sx, sy, sw, sh, 0, 0, targetW, targetH);
            } else {
                ctx.drawImage(srcCanvas, 0, 0, targetW, targetH);
            }

            // Normalisasi pencahayaan (Contrast Enhancement) agar kertas redup tetap terbaca tajam
            const normImg = ctx.getImageData(0, 0, targetW, targetH);
            const d = normImg.data;
            for (let i = 0; i < d.length; i += 4) {
                const avg = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
                // Stretch kontras
                const stretched = avg < 110 ? Math.max(0, avg * 0.6) : (avg > 185 ? 255 : avg);
                d[i] = d[i + 1] = d[i + 2] = stretched;
            }
            ctx.putImageData(normImg, 0, 0);

            return out;
        }

        // Opsional AI Vision Gemini untuk membaca tulisan tangan Nama & Nomor Peserta di bagian atas LJK
        async function extractStudentIdentityWithGemini(canvas) {
            try {
                // Potong hanya bagian header (300px teratas) agar hemat bandwidth & cepat
                const cropCanvas = document.createElement('canvas');
                cropCanvas.width = canvas.width;
                cropCanvas.height = 300;
                cropCanvas.getContext('2d').drawImage(canvas, 0, 0, canvas.width, 300, 0, 0, canvas.width, 300);
                const base64Data = cropCanvas.toDataURL('image/jpeg', 0.8).split(',')[1];

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${AppState.settings.geminiApiKey}`;
                const payload = {
                    contents: [{
                        parts: [
                            { text: "Baca tulisan tangan pada lembar jawaban ujian ini dan kembalikan JSON dengan field: studentName, studentNumber, studentClass." },
                            { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                        ]
                    }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                studentName: { type: "STRING" },
                                studentNumber: { type: "STRING" },
                                studentClass: { type: "STRING" }
                            }
                        }
                    }
                };

                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const json = await resp.json();
                const text = json?.candidates?.[0]?.content?.parts?.[0]?.text;
                return text ? JSON.parse(text) : null;
            } catch (e) {
                return null;
            }
        }

        // 10. VIEW 4: SCANNER LJK OTOMATIS (KAMERA, UPLOAD FOTO/PDF, BATCH QUEUE)

        // Kontrol Kamera
        async function startCamera() {
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 1700 } }
                });
                const video = document.getElementById('scanner-video');
                video.srcObject = cameraStream;
                video.classList.remove('hidden');
                document.getElementById('camera-guide').classList.remove('hidden');
                document.getElementById('camera-placeholder').classList.add('hidden');
                document.getElementById('btn-start-cam').classList.add('hidden');
                document.getElementById('btn-stop-cam').classList.remove('hidden');
                document.getElementById('btn-capture-cam').disabled = false;
                showToast('Kamera Aktif', 'Arahkan kamera ke lembar jawaban LJK.', 'info');
            } catch (err) {
                showToast('Gagal Mengakses Kamera', 'Pastikan izin kamera diberikan di browser Anda.', 'error');
            }
        }

        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(t => t.stop());
                cameraStream = null;
            }
            const video = document.getElementById('scanner-video');
            if (video) {
                video.classList.add('hidden');
                document.getElementById('camera-guide').classList.add('hidden');
                document.getElementById('camera-placeholder').classList.remove('hidden');
                document.getElementById('btn-start-cam').classList.remove('hidden');
                document.getElementById('btn-stop-cam').classList.add('hidden');
                document.getElementById('btn-capture-cam').disabled = true;
            }
        }

        function captureFromCamera() {
            const video = document.getElementById('scanner-video');
            if (!video || !video.videoWidth) return;

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);

            const manualName = document.getElementById('cam-student-name').value.trim();
            document.getElementById('cam-student-name').value = '';

            enqueueScanItem({
                name: manualName || `Kamera_${new Date().toLocaleTimeString('id-ID')}`,
                sourceCanvas: canvas,
                meta: manualName ? { studentName: manualName } : {}
            });
        }

        // Upload Banyak File (JPG, PNG, dan PDF Multi-Halaman)
        async function handleBatchFilesUpload(event) {
            const files = Array.from(event.target.files || []);
            if (!files.length) return;

            showToast('Membaca Berkas...', `Memuat ${files.length} berkas ke dalam antrean pemindaian.`, 'info');

            for (const file of files) {
                if (file.type === 'application/pdf') {
                    await extractPdfPagesToQueue(file);
                } else if (file.type.startsWith('image/')) {
                    const canvas = await loadImageFileToCanvas(file);
                    const baseName = file.name.replace(/\.[^/.]+$/, '');
                    enqueueScanItem({
                        name: file.name,
                        sourceCanvas: canvas,
                        meta: { studentName: baseName }
                    });
                }
            }
        }

        function loadImageFileToCanvas(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const c = document.createElement('canvas');
                        c.width = img.width;
                        c.height = img.height;
                        c.getContext('2d').drawImage(img, 0, 0);
                        resolve(c);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function extractPdfPagesToQueue(pdfFile) {
            try {
                const arrayBuffer = await pdfFile.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 2.0 });
                    const canvas = document.createElement('canvas');
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;
                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

                    enqueueScanItem({
                        name: `${pdfFile.name} (Hal ${pageNum})`,
                        sourceCanvas: canvas,
                        meta: { studentName: `${pdfFile.name.replace('.pdf', '')}_Hal_${pageNum}` }
                    });
                }
            } catch (err) {
                showToast('Gagal Membaca PDF', `File ${pdfFile.name} rusak atau terproteksi.`, 'error');
            }
        }

        // Simulasi Batch Scanning 15 Lembar Sekaligus dengan OMR Real-Time
        function simulateBatchScan(count) {
            const exam = getActiveExam();
            if (!exam) return;

            const firstNames = ['Aditya', 'Bagas', 'Citra', 'Dewi', 'Eka', 'Farhan', 'Gita', 'Hendra', 'Intan', 'Joko', 'Kartika', 'Lutfi', 'Maya', 'Naufal', 'Putri'];
            const lastNames = ['Saputra', 'Wijaya', 'Kusuma', 'Pratiwi', 'Hidayat', 'Santoso', 'Nugroho', 'Rahmawati', 'Permana', 'Lestari'];

            for (let i = 0; i < count; i++) {
                const num = `BATCH-${String(i + 1).padStart(3, '0')}`;
                const name = `${firstNames[i % firstNames.length]} ${lastNames[(i * 3) % lastNames.length]}`;
                const answers = exam.answerKey.map((k, qIdx) => {
                    if (i === 2 && qIdx === 0) return 'DOUBLE'; // Simulasi jawaban ganda
                    return Math.random() > 0.22 ? k.answer : ['A', 'B', 'C', 'D'][(qIdx + i) % 4];
                });

                const canvas = renderSyntheticOmrCanvas(exam, { name, num, cls: exam.className, answers });
                enqueueScanItem({
                    name: `LJK_${num}_${name}.png`,
                    sourceCanvas: canvas,
                    meta: { studentName: name, studentNumber: num, studentClass: exam.className }
                });
            }
        }

        function enqueueScanItem(item) {
            scanQueue.push({
                id: 'Q-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
                name: item.name,
                status: 'pending',
                sourceCanvas: item.sourceCanvas,
                meta: item.meta || {},
                result: null
            });
            renderQueueUI();
            if (!isProcessingQueue) {
                processScanQueue();
            }
        }

        async function processScanQueue() {
            if (isProcessingQueue) return;
            isProcessingQueue = true;
            const exam = getActiveExam();

            while (scanQueue.some(q => q.status === 'pending')) {
                const nextItem = scanQueue.find(q => q.status === 'pending');
                if (!nextItem) break;

                nextItem.status = 'processing';
                renderQueueUI();

                // Beri jeda micro-task 40ms agar UI progress bar tetap responsif & tidak membekukan browser
                await new Promise(r => setTimeout(r, 40));

                try {
                    const omrOut = await processImageWithOMR(nextItem.sourceCanvas, exam, nextItem.meta);

                    // Validasi Anti-Duplikasi Lembar
                    const isDuplicate = AppState.results.some(r => r.sheetUid === omrOut.sheetUid);
                    if (isDuplicate) {
                        nextItem.status = 'duplicate';
                        nextItem.result = omrOut;
                    } else {
                        const graded = gradeStudentAnswers(exam, omrOut.answers, omrOut.statuses);
                        const record = {
                            id: 'RES-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5),
                            examId: exam.id,
                            sheetUid: omrOut.sheetUid,
                            studentName: omrOut.studentName,
                            studentClass: omrOut.studentClass,
                            studentNumber: omrOut.studentNumber,
                            ...graded,
                            scannedAt: new Date().toLocaleString('id-ID'),
                            imageDataUrl: omrOut.overlayDataUrl
                        };

                        AppState.results.unshift(record);
                        nextItem.result = record;
                        nextItem.status = record.needsVerification ? 'verify' : 'success';
                        await saveState();
                    }
                } catch (err) {
                    console.error(err);
                    nextItem.status = 'error';
                }

                renderQueueUI();
            }

            isProcessingQueue = false;
            showToast('Pemindaian Antrean Selesai', 'Seluruh lembar jawaban telah diproses dan dikoreksi otomatis.', 'success');
        }

        function clearScanQueue() {
            if (isProcessingQueue) return;
            scanQueue = [];
            renderQueueUI();
        }

        function renderQueueUI() {
            const listEl = document.getElementById('queue-list');
            const barEl = document.getElementById('queue-progress-bar');
            const summaryEl = document.getElementById('queue-summary-text');
            if (!listEl || !barEl || !summaryEl) return;

            if (scanQueue.length === 0) {
                barEl.style.width = '0%';
                summaryEl.textContent = 'Belum ada lembar dalam antrean saat ini.';
                listEl.innerHTML = `<div class="col-span-full text-center py-8 text-xs text-slate-400">Unggah foto/PDF LJK atau pindai melalui kamera untuk memulai antrean otomatis.</div>`;
                return;
            }

            const doneCount = scanQueue.filter(q => q.status !== 'pending' && q.status !== 'processing').length;
            const pct = Math.round((doneCount / scanQueue.length) * 100);
            barEl.style.width = `${pct}%`;
            summaryEl.textContent = `Progres: ${doneCount} dari ${scanQueue.length} lembar selesai dipindai (${pct}%)`;

            const badgeMap = {
                pending: '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-slate-100 text-slate-600">Menunggu</span>',
                processing: '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-blue-100 text-blue-700 animate-pulse">Memindai OMR...</span>',
                success: '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-100 text-emerald-700">Berhasil</span>',
                verify: '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-amber-100 text-amber-800">Perlu Verifikasi</span>',
                duplicate: '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-purple-100 text-purple-700">Duplikat Diabaikan</span>',
                error: '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-rose-100 text-rose-700">Gagal Baca</span>'
            };

            listEl.innerHTML = scanQueue.map(item => `
                <div class="p-3 rounded-xl border border-slate-200 bg-slate-50/50 flex items-center justify-between gap-2">
                    <div class="min-w-0">

                        </p>

                        ${badgeMap[item.status]}
                        ${item.result && item.status !== 'duplicate' ? `
                            <button onclick="openStudentDetailModal('${item.result.id}')" class="p-1.5 bg-white border border-slate-200 rounded-lg hover:bg-blue-50 text-blue-600" title="Periksa Detail & Hasil Scan">
                                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                            </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // ============================================================================
        // 11. VIEW 5: HASIL KOREKSI & VERIFIKASI MANUAL
        // ============================================================================
        let resultFilter = { search: '', classFilter: 'ALL', sortBy: 'newest', onlyVerify: false };

        function renderResults(container) {
            const exam = getActiveExam();
            if (!exam) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center">Silakan buat ujian terlebih dahulu.</div>`;
                return;
            }

            let list = AppState.results.filter(r => r.examId === exam.id);
            const classes = ['ALL', ...new Set(list.map(r => r.studentClass))];

            if (resultFilter.search) {
                const q = resultFilter.search.toLowerCase();
                list = list.filter(r => r.studentName.toLowerCase().includes(q) || r.studentNumber.toLowerCase().includes(q));
            }
            if (resultFilter.classFilter !== 'ALL') {
                list = list.filter(r => r.studentClass === resultFilter.classFilter);
            }
            if (resultFilter.onlyVerify) {
                list = list.filter(r => r.needsVerification);
            }

            if (resultFilter.sortBy === 'highest') list.sort((a, b) => b.score - a.score);
            else if (resultFilter.sortBy === 'lowest') list.sort((a, b) => a.score - b.score);
            else if (resultFilter.sortBy === 'name') list.sort((a, b) => a.studentName.localeCompare(b.studentName));

            container.innerHTML = `
                <div class="space-y-5">
                    <!-- Filter & Search Bar -->
                    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm flex flex-wrap items-center justify-between gap-3">
                        <div class="flex flex-wrap items-center gap-2.5 flex-1">
                            <div class="relative min-w-[220px] flex-1 sm:flex-initial">

                                <input type="text" placeholder="Cari nama / nomor peserta..." value="${resultFilter.search}"
                                    oninput="resultFilter.search=this.value; renderCurrentRoute();"
                                    class="w-full pl-9 pr-3 py-2 text-xs border border-slate-300 rounded-xl focus:outline-none focus:border-blue-500">
                            </div>

                            <select onchange="resultFilter.classFilter=this.value; renderCurrentRoute();" class="text-xs border border-slate-300 rounded-xl px-3 py-2 bg-white">
                                ${classes.map(c => `<option value="${c}" ${resultFilter.classFilter === c ? 'selected' : ''}>${c === 'ALL' ? 'Semua Kelas' : 'Kelas ' + c}</option>`).join('')}
                            </select>

                            <select onchange="resultFilter.sortBy=this.value; renderCurrentRoute();" class="text-xs border border-slate-300 rounded-xl px-3 py-2 bg-white">
                                <option value="newest" ${resultFilter.sortBy === 'newest' ? 'selected' : ''}>Urutkan: Terbaru</option>
                                <option value="highest" ${resultFilter.sortBy === 'highest' ? 'selected' : ''}>Nilai Tertinggi</option>
                                <option value="lowest" ${resultFilter.sortBy === 'lowest' ? 'selected' : ''}>Nilai Terendah</option>

                    <tr class="border-b border-slate-100 ${st === 'VERIFY' || st === 'DOUBLE' ? 'bg-amber-50' : ''}">

                            <label class="text-[10px] font-bold text-slate-500 uppercase">Nilai Akhir</label>
